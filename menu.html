<!DOCTYPE html>
<html>
<head>
  <title>Menu Navigasi</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    body { 
      margin:0; 
      background:#0d0d0d; 
      color:#00ffcc; 
      font-family:'Orbitron', sans-serif; 
    }
    nav {
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      padding:10px;
      background:linear-gradient(90deg, #0d0d0d, #1a0033, #001a33);
      box-shadow:0 0 12px #00ffcc;
    }
    a { 
      color:#00ffcc; 
      text-decoration:none; 
      padding:8px 16px; 
      border:1px solid #00ffcc; 
      border-radius:6px; 
      transition:0.3s; 
      font-size:14px;
      box-shadow:0 0 6px #00ffcc;
    }
    a:hover { 
      background:#00ffcc; 
      color:#0d0d0d; 
      box-shadow:0 0 15px #00ffcc;
    }
  </style>
</head>
<body>
  <nav>
    <a href="home.html" target="maincontent">🏠 Home</a>
    <a href="study.html" target="maincontent">📘 MyStudy</a>
  </nav>
</body>
</html>
