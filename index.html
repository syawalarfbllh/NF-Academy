<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tugas 1 - Javascript Dasar</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    h2, h1, h4 {
      text-align: center;
      width: 100%;
      margin-bottom: 25px;
      color: #00e0ff;
      text-shadow: 0 0 15px #00e0ff;
    }
    .container {
      display: flex;
      gap: 20px;
    }
    .card {
      flex: 1;
      padding: 20px;
      border-radius: 12px;
      background: #1c1c1c;
      box-shadow: 0 0 15px rgba(0, 224, 255, 0.3);
      transition: transform 0.3s;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px rgba(0, 224, 255, 0.6);
    }
    .card h3 {
      text-align: center;
      color: #00e0ff;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #00e0ff;
    }
    label {
      display: block;
      margin: 5px 0 3px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      margin-bottom: 10px;
      outline: none;
      background: #2a2a2a;
      color: #fff;
      box-shadow: inset 0 0 8px rgba(0,224,255,0.5);
    }
    button {
      background: #00e0ff;
      color: #000;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: 0.3s;
    }
    button:hover {
      background: #00aacc;
      box-shadow: 0 0 15px #00e0ff;
    }
    .result {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
    }
  </style>
</head>
<body>
  <div>
    <h1>Tugas 1 Javascript</h1>
    <h2>Luas Bangun Datar</h2>
    <div class="container">
      
      <!-- Persegi Panjang -->
      <div class="card">
        <h3>Persegi Panjang</h3>
        <label>Panjang:</label>
        <input type="number" id="ppanjang">
        <label>Lebar:</label>
        <input type="number" id="plebar">
        <button onclick="hitungPersegiPanjang()">Hitung</button>
        <div class="result" id="hasilPP"></div>
      </div>

      <!-- Bujur Sangkar -->
      <div class="card">
        <h3>Bujur Sangkar</h3>
        <label>Sisi:</label>
        <input type="number" id="sisi">
        <button onclick="hitungBujurSangkar()">Hitung</button>
        <div class="result" id="hasilBS"></div>
      </div>

      <!-- Segitiga -->
      <div class="card">
        <h3>Segitiga</h3>
        <label>Alas:</label>
        <input type="number" id="alas">
        <label>Tinggi:</label>
        <input type="number" id="tinggi">
        <button onclick="hitungSegitiga()">Hitung</button>
        <div class="result" id="hasilSG"></div>
      </div>
    </div>
    <h4>Muhammad Syawal Arif Billah</h4>
  </div>
  

  <script>
    // Fungsi hitung persegi panjang
    function hitungPersegiPanjang() {
      let p = document.getElementById("ppanjang").value;
      let l = document.getElementById("plebar").value;
      let luas = p * l;
      document.getElementById("hasilPP").innerText = "Luas = " + luas;
    }

    // Fungsi hitung bujur sangkar
    function hitungBujurSangkar() {
      let s = document.getElementById("sisi").value;
      let luas = s * s;
      document.getElementById("hasilBS").innerText = "Luas = " + luas;
    }

    // Fungsi hitung segitiga
    function hitungSegitiga() {
      let a = document.getElementById("alas").value;
      let t = document.getElementById("tinggi").value;
      let luas = 0.5 * a * t;
      document.getElementById("hasilSG").innerText = "Luas = " + luas;
    }
  </script>
</body>
</html>
